name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python flash_locale.py examples/strings.csv --require-locale es --require-locale fr --json
